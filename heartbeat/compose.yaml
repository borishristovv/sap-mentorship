
services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  heartbeat:
    build: .
    image: heartbeat:local
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/heartbeat
    depends_on:
      mongodb:
        condition: service_healthy
    command: ["--heartbeat.monitor.enabled=true"]

volumes:
  mongo-data:
